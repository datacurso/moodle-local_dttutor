#
# Whenever a new release is published, add the tagged version
# to the Moodle Plugins directory at https://moodle.org/plugins
#
# revision: 2021070201
#
name: Releasing in the Plugins directory

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released'
        required: true

defaults:
  run:
    shell: bash

# The job only reads the repository; publishing goes through the moodle.org token.
permissions:
  contents: read

jobs:
  release-at-moodle-org:
    runs-on: ubuntu-latest
    # The token lives in this environment, so a release can be made to wait for a reviewer.
    environment: moodle-org-release
    env:
      PLUGIN: local_dttutor
      CURL: curl -s
      ENDPOINT: https://moodle.org/webservice/rest/server.php
      TOKEN: ${{ secrets.MOODLE_ORG_TOKEN }}
      FUNCTION: local_plugins_add_version

    steps:
      - name: Call the service function
        id: add-version
        env:
          # Passed as data, never interpolated into the script: a tag typed by hand must not
          # be able to run commands next to the publishing token.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            TAGNAME="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" = refs/tags/* ]]; then
            TAGNAME="${GITHUB_REF##*/}"
          fi
          if [[ -z "${TAGNAME:-}" ]]; then
            echo "No tag name has been provided!"
            exit 1
          fi
          if [[ ! "${TAGNAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The tag is not a release version (expected 1.2.3, v1.2.3 or 1.2.3-suffix)."
            exit 1
          fi
          ZIPURL="https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/${TAGNAME}"
          RESPONSE=$(${CURL} ${ENDPOINT} --data-urlencode "wstoken=${TOKEN}" \
                                         --data-urlencode "wsfunction=${FUNCTION}" \
                                         --data-urlencode "moodlewsrestformat=json" \
                                         --data-urlencode "frankenstyle=${PLUGIN}" \
                                         --data-urlencode "zipurl=${ZIPURL}" \
                                         --data-urlencode "vcssystem=git" \
                                         --data-urlencode "vcsrepositoryurl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                                         --data-urlencode "vcstag=${TAGNAME}" \
                                         --data-urlencode "changelogurl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${TAGNAME}" \
                                         --data-urlencode "altdownloadurl=${ZIPURL}")
          echo "response=${RESPONSE}" >> $GITHUB_OUTPUT

      - name: Evaluate the response
        id: evaluate-response
        env:
          RESPONSE: ${{ steps.add-version.outputs.response }}
        run: |
          jq <<< "${RESPONSE}"
          jq --exit-status ".id" <<< "${RESPONSE}" > /dev/null
